<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<title>souWhat 搜啥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f7;overflow:hidden;height:100vh;width:100vw}
#app{width:100%;height:100%;border:none;display:block}
.loading{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f5f7;color:#1d1d1f;flex-direction:column;gap:16px;z-index:10
}
.spinner{width:32px;height:32px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ff4757;font-size:14px;display:none}
</style>
</head>
<body>
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div style="font-size:16px;color:#666">正在连接 souWhat...</div>
  <div class="error" id="error">无法连接到服务，请确认电脑已开机并启动了 souWhat 服务</div>
</div>
<iframe id="app" sandbox="allow-scripts allow-same-origin allow-forms allow-popups" style="display:none"></iframe>

<script>
(async function() {
  try {
    const res = await fetch('config.json?_=' + Date.now());
    const config = await res.json();
    if (config.url) {
      const iframe = document.getElementById('app');
      iframe.src = config.url;
      iframe.style.display = 'block';
      document.getElementById('loading').style.display = 'none';
    } else {
      throw new Error('地址为空');
    }
  } catch (e) {
    document.querySelector('.spinner').style.display = 'none';
    document.getElementById('error').style.display = 'block';
  }
})();
</script>
</body>
</html>
