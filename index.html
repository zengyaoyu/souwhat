<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>souWhat 搜啥</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#f5f5f7;color:#1d1d1f;display:flex;align-items:center;justify-content:center;
  min-height:100vh;text-align:center;padding:20px
}
.card{background:white;border-radius:16px;padding:40px 30px;box-shadow:0 2px 12px rgba(0,0,0,0.08);max-width:360px;width:100%}
.icon{font-size:48px;margin-bottom:16px}
h1{font-size:20px;font-weight:600;margin-bottom:8px}
p{font-size:14px;color:#666;line-height:1.6;margin-bottom:20px}
.spinner{display:inline-block;width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#667eea;border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ff4757;font-size:13px;display:none}
.retry{display:none;color:#667eea;text-decoration:none;font-size:14px;cursor:pointer;margin-top:12px}
</style>
</head>
<body>
<div class="card">
  <div class="icon">🔍</div>
  <h1>正在进入 souWhat</h1>
  <p>正在查找最新的服务地址，请稍候...</p>
  <div class="spinner" id="spinner"></div>
  <div class="error" id="error">无法连接到服务，请确认服务已启动</div>
  <a class="retry" id="retry" onclick="location.reload()">重新尝试</a>
</div>

<script>
(async function() {
  try {
    // 从 config.json 读取最新地址
    const res = await fetch('config.json?_=' + Date.now());
    const config = await res.json();
    if (config.url) {
      window.location.href = config.url;
    } else {
      throw new Error('地址为空');
    }
  } catch (e) {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('error').style.display = 'block';
    document.getElementById('retry').style.display = 'block';
  }
})();
</script>
</body>
</html>
